<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      /* Цвета подставляются из темы Telegram, запасные значения — для открытия в обычном браузере */
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #7d7d7d);
      --link: var(--tg-theme-link-color, #2481cc);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 8px 0 4px; font-size: 24px; }
    p.sub { margin: 0 0 20px; color: var(--hint); }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .row span:first-child { color: var(--hint); }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: .8; }
    #count { font-size: 40px; font-weight: 700; text-align: center; margin: 4px 0 12px; }
  </style>
</head>
<body>
  <h1 id="hello">Привет!</h1>
  <p class="sub" id="sub">Это стартовый шаблон Telegram Mini App.</p>

  <div class="card">
    <div id="count">0</div>
    <button id="tap">Нажми меня</button>
  </div>

  <div class="card" id="info"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const inTelegram = !!(tg && tg.initData);

    if (tg) {
      tg.ready();    // сообщаем Telegram, что приложение загрузилось
      tg.expand();   // раскрываем на всю высоту
    }

    // Данные пользователя (только для отображения; для проверки на сервере нужен initData)
    const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    document.getElementById('hello').textContent =
      user ? `Привет, ${user.first_name}!` : 'Привет!';
    if (!inTelegram) {
      document.getElementById('sub').textContent =
        'Открыто вне Telegram: часть возможностей недоступна.';
    }

    // Простой счётчик с вибрацией
    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('tap').addEventListener('click', () => {
      count += 1;
      countEl.textContent = count;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    // Главная кнопка Telegram внизу экрана
    if (inTelegram) {
      tg.MainButton.setText('Закрыть');
      tg.MainButton.show();
      tg.MainButton.onClick(() => tg.close());
    }

    // Сведения об окружении
    const rows = [
      ['Платформа', tg ? tg.platform : '—'],
      ['Версия Telegram', tg ? tg.version : '—'],
      ['Тема', tg ? tg.colorScheme : '—'],
    ];
    document.getElementById('info').innerHTML = rows
      .map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`)
      .join('');
  </script>
</body>
</html>
