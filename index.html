<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FlexMarket</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* Тёмная тема — обсидиан, светлая — камень. Акцент — золото из инвентаря Minecraft. */
    :root {
      --bg: #1a1424; --panel: #2a2140; --panel2: #382d58; --edge: #0d0916;
      --text: #f2edff; --hint: #a99dc9; --gold: #ffc93c; --gold-ink: #3a2700;
      --free: #62d66f; --danger: #ff6b6b; --hi: rgba(255,255,255,.14); --lo: rgba(0,0,0,.38);
      --px: "Press Start 2P", ui-monospace, Menlo, monospace;
      --notch: polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
    }
    :root[data-theme="light"] {
      --bg: #d9d5cb; --panel: #c4bfb2; --panel2: #e8e5dc; --edge: #3a362c;
      --text: #1d1a14; --hint: #5d584b; --gold: #e0a000; --gold-ink: #2b1d00;
      --free: #1f8a30; --danger: #c93030; --hi: rgba(255,255,255,.55); --lo: rgba(0,0,0,.2);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: calc(64px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }
    [hidden] { display: none !important; }
    svg.pix { display: block; shape-rendering: crispEdges; }
    .px { font-family: var(--px); letter-spacing: 0; }

    /* Базовый «слот»: ступенчатые углы и объёмная рамка */
    .slot {
      background: var(--panel); clip-path: var(--notch);
      box-shadow: inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo);
    }
    .slot.sunk { background: var(--edge); box-shadow: inset 3px 3px 0 rgba(0,0,0,.45), inset -3px -3px 0 var(--hi); }
    :root[data-theme="light"] .slot.sunk { background: #b3ad9e; }

    /* Верхняя панель */
    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--bg);
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 4px solid var(--edge);
    }
    .brand { font-family: var(--px); font-size: 13px; display: flex; align-items: center; gap: 9px; }
    .brand b { color: var(--gold); font-weight: 400; }
    .right { display: flex; align-items: center; gap: 8px; }
    .gift { border: 0; width: 40px; height: 40px; display: grid; place-items: center; background: var(--panel2); cursor: pointer; }
    .gift:active { transform: translateY(2px); }
    s.old { color: var(--hint); font-size: .62em; margin-right: 8px; text-decoration-thickness: 3px; }
    .chip { display: flex; align-items: center; gap: 7px; padding: 8px 12px; font-family: var(--px); font-size: 11px; }

    /* Категории и поиск */
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 14px 0; }
    .tab {
      border: 0; color: var(--text); font: inherit; font-weight: 600; font-size: 12.5px; padding: 11px 4px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
    }
    .tab.on { background: var(--gold); color: var(--gold-ink); }
    .search { margin: 10px 14px 0; display: block; }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; padding: 12px 14px; }
    .search input::placeholder { color: var(--hint); }

    .note { margin: 12px 14px 0; padding: 11px 13px; font-size: 13px; color: var(--hint); }
    .note b { color: var(--text); }
    .note.warn { color: var(--text); background: var(--panel2); }

    /* Карточки товаров */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 14px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card { border: 0; padding: 6px; text-align: left; color: var(--text); font: inherit; cursor: pointer; position: relative; display: block; width: 100%; }
    .card:active { transform: translateY(2px); }
    .card.top1 { background: var(--gold); }
    .card.top1 .name, .card.top1 .dl { color: var(--gold-ink); }
    .thumb { aspect-ratio: 4 / 3; width: 100%; display: block; object-fit: cover; background: var(--edge); }
    .ph {
      display: grid; place-items: center;
      background: repeating-conic-gradient(var(--c1) 0 25%, var(--c2) 0 50%) 0 0 / 24px 24px;
    }
    [data-cat="resourcepacks"] { --c1: #3f7a46; --c2: #4a8c52; }
    [data-cat="configs"] { --c1: #52586b; --c2: #5f667b; }
    [data-cat="shaders"] { --c1: #5b3f94; --c2: #6a4aa8; }
    .ph svg { filter: drop-shadow(3px 3px 0 rgba(0,0,0,.35)); }
    .tag {
      position: absolute; top: 12px; left: 12px; font-family: var(--px); font-size: 8px; padding: 6px 7px 5px;
      background: var(--edge); color: var(--free);
    }
    .tag.paid { color: var(--gold); }
    .tag.off { left: auto; right: 12px; color: var(--hint); }
    .name { font-weight: 650; font-size: 14px; padding: 9px 4px 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 3em; }
    .dl { display: flex; align-items: center; gap: 6px; padding: 2px 4px 4px; color: var(--hint); font-size: 12px; }
    .by { color: var(--gold); font-size: 11.5px; padding-top: 0; }
    .card.top1 .by { color: var(--gold-ink); }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--hint); padding: 46px 16px; }
    .empty svg { margin: 0 auto 12px; opacity: .8; }

    /* Нижняя панель-хотбар */
    .hotbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg);
      border-top: 4px solid var(--edge); padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .hb { border: 0; font: inherit; color: var(--text); padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .hb.on { outline: 3px solid #fff; outline-offset: -3px; background: var(--panel2); }
    :root[data-theme="light"] .hb.on { outline-color: #1d1a14; }

    .fab {
      position: fixed; right: 16px; bottom: calc(98px + env(safe-area-inset-bottom)); z-index: 9; border: 0; width: 58px; height: 58px;
      background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; cursor: pointer;
    }
    .fab:active { transform: translateY(2px); }

    /* Профиль */
    .view { padding-bottom: 8px; }
    .pad { padding: 14px 14px 0; }
    .me { display: flex; align-items: center; gap: 13px; padding: 14px; }
    .ava { width: 56px; height: 56px; flex: none; background: var(--edge); display: grid; place-items: center; overflow: hidden; clip-path: var(--notch); }
    .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .me h2 { margin: 0; font-size: 18px; line-height: 1.2; word-break: break-word; }
    .me p { margin: 3px 0 0; color: var(--hint); font-size: 13px; }
    .bal { margin-top: 12px; padding: 18px 16px 16px; text-align: center; }
    .bal .lab { color: var(--hint); font-size: 13px; }
    .bal .num { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0 10px; font-family: var(--px); font-size: 30px; color: var(--gold); text-shadow: 3px 3px 0 var(--edge); }
    .bal .fine { font-size: 12.5px; color: var(--hint); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .st { padding: 12px 6px 10px; text-align: center; }
    .st .v { font-family: var(--px); font-size: 16px; }
    .st .l { margin-top: 8px; font-size: 11.5px; color: var(--hint); }
    .sec { margin: 22px 2px 8px; font-weight: 700; font-size: 15px; }
    .how { margin: 0 2px 10px; color: var(--hint); font-size: 13.5px; }
    .link { padding: 12px 13px; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; }
    .friends { padding: 6px 14px; margin-top: 10px; }
    .friend { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 14px; }
    .friend + .friend { border-top: 2px solid var(--lo); }
    .friend span:last-child { margin-left: auto; font-family: var(--px); font-size: 10px; color: var(--gold); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; border: 0; padding: 14px 12px; font: inherit; font-weight: 700;
      background: var(--gold); color: var(--gold-ink); cursor: pointer; margin-top: 10px; text-align: center;
    }
    .btn:active { transform: translateY(2px); }
    .btn.alt { background: var(--panel2); color: var(--text); }
    .btn.red { background: var(--panel2); color: var(--danger); }
    .btn:disabled { opacity: .5; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .two .btn { margin-top: 10px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .three .btn { margin-top: 12px; padding: 12px 4px; font-size: 13.5px; }

    /* Экран-заглушка (подписка, ошибки) */
    .msg { margin: 26px 16px 0; padding: 26px 20px 22px; text-align: center; }
    .msg .big { display: grid; place-items: center; margin-bottom: 16px; }
    .msg h2 { margin: 0 0 8px; font-size: 20px; }
    .msg p { margin: 0 0 8px; color: var(--hint); }

    /* Окна */
    .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(8,5,14,.7); display: flex; align-items: flex-end; animation: fade .15s; }
    .sheet {
      width: 100%; max-height: 92vh; overflow-y: auto; background: var(--bg); border-top: 4px solid var(--edge);
      padding: 0 0 calc(18px + env(safe-area-inset-bottom)); animation: up .2s ease-out;
    }
    @keyframes up { from { transform: translateY(36px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .hero { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
    .body { padding: 16px; }
    .body h2 { margin: 0 0 10px; font-size: 21px; line-height: 1.2; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chips .slot { padding: 7px 10px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
    .desc { white-space: pre-wrap; margin: 14px 0 6px; opacity: .92; }
    label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 6px; }
    .field { display: block; }
    .field input, .field textarea, .field select { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; padding: 12px 14px; }
    .field select option { color: #111; }
    .field textarea { min-height: 92px; resize: vertical; }
    .imgpick { position: relative; width: 100%; aspect-ratio: 16 / 10; display: grid; place-items: center; color: var(--hint); overflow: hidden; }
    .imgpick img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .check { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--text); font-size: 14px; }
    .check input { width: 20px; height: 20px; accent-color: var(--gold); }
    .err { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
    .toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; background: var(--edge); color: #fff; padding: 11px 16px; font-size: 14px; max-width: 86%; text-align: center; clip-path: var(--notch); }
    ul.res { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; }
    ul.res li { margin: 4px 0; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><span id="logo"></span><span>Flex<b>Market</b></span></div>
    <div class="right"><button class="gift slot" id="giftBtn" hidden aria-label="Ввести промо-код"></button><div class="chip slot sunk" id="balChip" hidden></div></div>
  </div>

  <main>
    <section class="view" id="vCatalog" hidden>
      <div class="tabs" id="tabs"></div>
      <label class="search slot sunk" style="margin-bottom:0;color:inherit"><input id="search" type="search" placeholder="Поиск по названию" autocomplete="off"></label>
      <div id="banner"></div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="view" id="vProfile" hidden></section>
    <section class="view" id="vSub" hidden></section>
    <section class="view" id="vMsg" hidden></section>
  </main>

  <button class="fab slot" id="fab" hidden aria-label="Добавить товар"></button>
  <nav class="hotbar" id="hotbar" hidden>
    <button class="hb slot" id="hbCatalog"></button>
    <button class="hb slot" id="hbProfile"></button>
    <button class="hb slot" id="hbSub"></button>
  </nav>

  <script>
    // ====== НАСТРОЙКИ ======
    const API_URL = "https://mybot.fleexis123.workers.dev"; // адрес сервера (Cloudflare Worker)
    const CONTACT = "";                                    // username для кнопки «Купить» (без @)
    const OWNER_ID = 5171403469;                           // только чтобы показать владельцу причину, если админка не открылась
    // =======================

    const CATS = [
      { id: "resourcepacks", name: "Ресурс паки", icon: "cube" },
      { id: "configs", name: "Конфиги", icon: "gear" },
      { id: "shaders", name: "Шейдеры", icon: "spark" },
    ];

    // Пиксельные иконки 8×8: буква = цвет из палитры, точка = пусто
    const ICONS = {
      star: { g: ["...YY...", "...YY...", "YYYYYYYY", ".YYYYYY.", "..YYYY..", "..YYYY..", ".YY..YY.", ".Y....Y."], p: { Y: "#ffc93c" } },
      cube: { g: ["...tt...", ".tttttt.", "tttttttt", "lllldddd", "lllldddd", "lllldddd", ".lllddd.", "...ld..."], p: { t: "#9be37a", l: "#6cae4f", d: "#8a5a34" } },
      gear: { g: ["...dd...", ".d.dd.d.", "..dddd..", "dddhhddd", "dddhhddd", "..dddd..", ".d.dd.d.", "...dd..."], p: { d: "#aeb6cc", h: "#4a5068" } },
      spark: { g: ["...ss...", "...ss...", "..ssss..", "ssssssss", "ssssssss", "..ssss..", "...ss...", "...ss..."], p: { s: "#d9b8ff" } },
      chest: { g: [".bbbbbb.", "bbbbbbbb", "bddddddb", "bbbggbbb", "bbbggbbb", "bbbbbbbb", "bddddddb", ".bbbbbb."], p: { b: "#b87a3a", d: "#7a4d22", g: "#ffc93c" } },
      head: { g: [".hhhhhh.", "hhhhhhhh", "ssssssss", "sessses.", "ssssssss", "sssmmsss", ".ssssss.", "..ssss.."], p: { h: "#6b4423", s: "#e0ac82", e: "#2b1a3a", m: "#b4694a" } },
      plus: { g: ["...pp...", "...pp...", "...pp...", "pppppppp", "pppppppp", "...pp...", "...pp...", "...pp..."], p: { p: "currentColor" } },
      down: { g: ["...dd...", "...dd...", "...dd...", "dddddddd", ".dddddd.", "..dddd..", "...dd...", "........"], p: { d: "currentColor" } },
      crown: { g: ["y..yy..y", "yy.yy.yy", "yyyyyyyy", "yyyyyyyy", "yyrryyrr".slice(0,8), "yyyyyyyy", "yyyyyyyy", "........"], p: { y: "#ffc93c", r: "#ff6b6b" } },
      gift: { g: ["..rr.rr.", "...rrr..", "bbbrrbbb", "bbbrrbbb", "rrrrrrrr", "bbbrrbbb", "bbbrrbbb", "bbbrrbbb"], p: { r: "#ffc93c", b: "#d4504a" } },
      lock: { g: ["..llll..", ".l....l.", ".l....l.", "gggggggg", "ggggkggg", "ggggkggg", "gggggggg", "gggggggg"], p: { l: "#aeb6cc", g: "#ffc93c", k: "#3a2700" } },
      warn: { g: ["...rr...", "...rr...", "..rrrr..", "..rwwr..", ".rrwwrr.", ".rrrrrr.", "rrrwwrrr", "rrrrrrrr"], p: { r: "#ff6b6b", w: "#fff" } },
    };
    function pix(name, size) {
      const ic = ICONS[name]; const n = 8;
      let r = "";
      ic.g.forEach((row, y) => [...row].forEach((c, x) => { if (c !== "." && ic.p[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${ic.p[c]}"/>`; }));
      const wrap = document.createElement("span");
      wrap.style.display = "inline-flex";
      wrap.innerHTML = `<svg class="pix" width="${size}" height="${size}" viewBox="0 0 ${n} ${n}" aria-hidden="true">${r}</svg>`;
      return wrap;
    }

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

    const state = { cat: CATS[0].id, q: "", items: [], me: null, view: "", adminCode: "", loading: true };

    // ---------- Вспомогательные ----------
    function h(tag, props, ...kids) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (k === "class") node.className = v;
        else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else if (v === true) node.setAttribute(k, "");
        else if (v !== false && v != null) node.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid == null || kid === false) continue;
        node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return node;
    }
    const $ = (id) => document.getElementById(id);

    function toast(text) {
      const t = h("div", { class: "toast" }, text);
      document.body.append(t);
      setTimeout(() => t.remove(), 2800);
    }
    function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
    const catOf = (id) => CATS.find((c) => c.id === id) || CATS[0];
    const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "");
    const imgSrc = (it) => (it.has_image ? `${API_URL}/api/img/${it.id}?v=${it.v}` : "");
    function openLink(url) { if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank"); }
    function openTg(url) { if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank"); }
    function dlWord(n) { const a = n % 100, b = n % 10; return n + (a > 10 && a < 15 ? " скачиваний" : b === 1 ? " скачивание" : b >= 2 && b <= 4 ? " скачивания" : " скачиваний"); }
    function sortItems(list) { return list.sort((a, b) => (b.downloads || 0) - (a.downloads || 0) || b.id - a.id); }

    // ---------- Тема ----------
    function applyTheme() {
      const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      try {
        const c = dark ? "#1a1424" : "#d9d5cb";
        tg && tg.setHeaderColor && tg.setHeaderColor(c);
        tg && tg.setBackgroundColor && tg.setBackgroundColor(c);
        tg && tg.setBottomBarColor && tg.setBottomBarColor(c);
      } catch (e) {}
    }
    applyTheme();
    if (tg && tg.onEvent) tg.onEvent("themeChanged", applyTheme);

    // ---------- Сервер ----------
    async function api(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (tg && tg.initData) headers.Authorization = "tma " + tg.initData;
      if (opts.body) headers["Content-Type"] = "application/json";
      const code = opts.code != null ? opts.code : state.adminCode;
      if (path.startsWith("/api/admin/") && code) headers["X-Admin-Code"] = code;
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 20000);
      let res;
      try {
        try { res = await fetch(API_URL + path, { method: opts.method, body: opts.body, headers, signal: ctl.signal }); }
        catch (e) {
          // редкий сбой сети или медленный старт сервера: один тихий повтор (только для чтения)
          if (opts.method && opts.method !== "GET") throw e;
          res = await fetch(API_URL + path, { method: "GET", headers });
        }
      } finally { clearTimeout(timer); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const e = new Error(data.error || "http_" + res.status);
        e.code = data.error || "http_" + res.status; e.retry = data.retry; e.status = res.status;
        if (e.code === "bad_code" && opts.code == null) state.adminCode = "";
        throw e;
      }
      return data;
    }

    // ---------- Загрузка ----------
    async function load(check) {
      try {
        const me = await api("/api/me" + (check ? "?check=1" : ""));
        state.me = me;
        if (!me.auth) return showMsg("lock", "Открой через бота", authReason(me.why), [btn("Закрыть", "alt", () => tg && tg.close && tg.close())]);
        if (!me.subscribed) return showGate(me);
        const res = await api("/api/items");
        state.items = sortItems(res.items || []);
        state.loading = false;
        setView(state.view === "profile" || state.view === "sub" ? state.view : "catalog");
      } catch (e) {

        no_initdata: "Telegram не передал данные входа. Закрой приложение и открой его кнопкой «Открыть» в личном чате с ботом.",
        bad_signature: "Подпись Telegram не совпала с токеном бота на сервере. Похоже, воркер подключён к другому боту.",
        no_bot_token: "На сервере не задан токен бота (секрет BOT_TOKEN).",

    function renderCatalog() {
      banners();
      $("tabs").replaceChildren(...CATS.map((c) =>
        h("button", { class: "tab slot" + (c.id === state.cat ? " on" : ""), onclick: () => { state.cat = c.id; renderCatalog(); } }, pix(c.icon, 26), c.name)
      ));

      }

          btn("Заявки на подписку" + (me.pending_payments ? ` (${me.pending_payments})` : ""), "", () => withAdmin(openPayments)),
          btn("Модерация товаров" + (me.pending_items ? ` (${me.pending_items})` : ""), "", () => withAdmin(openModeration)),
          btn("Промо-коды", "", () => withAdmin(openPromos)),
          btn("Рефералы: кто и кого пригласил", "alt", () => withAdmin(openReferrals)),

    function stat(v, l) { return h("div", { class: "st slot" }, h("div", { class: "v" }, String(v)), h("div", { class: "l" }, l)); }

    async function setupBot() {
      try {
        const r = await api("/api/admin/setup-bot", { method: "POST" });
        const lines = (r.errors || []).map((e) => h("li", {}, e));
        openSheet(h("div", { class: "body" },
          h("h2", {}, r.ok ? "Бот настроен" : "Бот настроен не полностью"),
          r.username ? h("p", { class: "how" }, "Бот: @" + r.username) : null,
          lines.length ? h("ul", { class: "res" }, lines) : h("p", { class: "how" }, "Команды, меню и вебхук включены. Открой бота и отправь /start."),
          btn("Понятно", "alt", () => closeSheet && closeSheet())
        ));
        await refreshMe();
      } catch (e) { toast(adminErr(e)); }
    }

    // ---------- Отчёт по рефералам (только настоящий админ) ----------
    const fmtDate = (ts) => { try { return new Date(ts * 1000).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
    const who = (n, u) => (n || "Без имени") + (u ? " @" + u : "");

    async function openReferrals() {
      let d;
      try { d = await api("/api/admin/referrals"); } catch (e) { toast(adminErr(e)); return; }
      let tab = "top";
      const list = h("div", { class: "friends slot", style: "margin-top:12px" });
      const tabs = h("div", { class: "two" });
      const draw = () => {
        tabs.replaceChildren(
          h("button", { class: "btn slot " + (tab === "top" ? "" : "alt"), onclick: () => { tab = "top"; draw(); } }, "Кто приглашал"),
          h("button", { class: "btn slot " + (tab === "recent" ? "" : "alt"), onclick: () => { tab = "recent"; draw(); } }, "Последние"));
        const rows = tab === "top"
          ? d.top.map((x) => h("div", { class: "friend", style: "align-items:flex-start" },

          : d.recent.map((x) => h("div", { class: "friend", style: "align-items:flex-start" },

                h("div", { style: "color:var(--hint);font-size:12px" }, "пригласил: " + who(x.inviter.name, x.inviter.username) + ` (ID ${x.inviter.id})`)),
              h("span", { style: x.confirmed ? "" : "color:var(--hint)" }, x.confirmed ? "+2" : "…")));

        h("p", { class: "how", style: "margin-top:12px" }, "В списке «Кто приглашал»: подписались / всего зашло. Показаны до 100 записей."),
        tabs, list,
        btn("Закрыть", "alt", () => closeSheet && closeSheet())
      ));

    // ---------- Рассылка (только настоящий админ) ----------
    async function openBroadcast() {
      let st;
      try { st = await api("/api/admin/broadcast/status"); } catch (e) { toast(adminErr(e)); return; }
      const text = h("textarea", { maxlength: "3500", placeholder: "Текст сообщения" });
      const bt = h("input", { type: "text", maxlength: "40", placeholder: "Текст кнопки (необязательно)" });
      const bu = h("input", { type: "url", placeholder: "Ссылка кнопки, https://…" });
      const field = (el) => h("label", { class: "field slot sunk", style: "margin:0;padding:0;color:inherit" }, el);
      const out = h("div", { class: "err", style: "color:var(--hint)" });
      const read = () => ({ text: text.value.trim(), btn_text: bt.value.trim(), btn_url: bu.value.trim() });
      const post = (p, body) => api("/api/admin/broadcast/" + p, { method: "POST", body: JSON.stringify(body) });
      const errText = (e) => ({ bad_text: "Напиши текст сообщения", bad_button: "Кнопке нужны и текст, и ссылка с https://", no_audience: "Некому отправлять" })[e.code] || adminErr(e);
      const testBtn = btn("Отправить мне для проверки", "alt", async () => {
        const b = read(); if (!b.text) { out.textContent = "Напиши текст сообщения"; return; }
        testBtn.disabled = true; out.textContent = "";
        try { const r = await post("test", b); out.textContent = r.ok ? "Отправлено тебе в чат с ботом" : "Не отправилось: " + r.error; }
        catch (e) { out.textContent = errText(e); }
        testBtn.disabled = false;
      });
      async function run(id, total) {
        allBtn.disabled = true; testBtn.disabled = true;
        try {
          for (let i = 0; i < 400; i++) {
            const r = await post("step", { id });
            out.style.color = "var(--text)";
            out.textContent = `Отправлено ${r.sent} из ${r.total}` + (r.failed ? `, не доставлено ${r.failed}` : "");
            if (r.done) { haptic("success"); out.textContent = `Готово. Получили ${r.sent}, не доставлено ${r.failed} (заблокировали бота или не запускали его).`; return; }
            if (r.wait) await new Promise((res) => setTimeout(res, r.wait * 1000));
          }
        } catch (e) { out.style.color = "var(--danger)"; out.textContent = "Остановилось: " + errText(e) + ". Нажми «Отправить всем» ещё раз — продолжу с того же места."; allBtn.disabled = false; testBtn.disabled = false; }
      }
      const allBtn = btn(`Отправить всем (${st.audience})`, "", async () => {
        const b = read(); if (!b.text) { out.textContent = "Напиши текст сообщения"; return; }
        const ok = tg && tg.showConfirm ? await new Promise((res) => tg.showConfirm(`Отправить сообщение ${st.audience} людям? Отменить будет нельзя.`, res)) : confirm("Отправить всем? Отменить нельзя.");
        if (!ok) return;
        out.textContent = "";
        try { const r = await post("start", b); await run(r.id, r.total); }
        catch (e) {
          if (e.code === "already_running") { await run(e.id, e.total); }
          else { out.style.color = "var(--danger)"; out.textContent = errText(e); }
        }
      });
      openSheet(h("div", { class: "body" },
        h("h2", {}, "Рассылка"),
        h("p", { class: "how" }, `Сообщение получат до ${st.audience} человек. Не закрывай окно, пока идёт отправка. Реже раза в несколько дней писать не стоит: люди блокируют бота.`),
        h("label", {}, "Сообщение"), field(text),
        h("label", {}, "Кнопка под сообщением"), field(bt), h("div", { style: "height:8px" }), field(bu),
        out, testBtn, allBtn
      ));
      if (st.last && st.last.status === "running") { out.textContent = `Есть незаконченная рассылка (${st.last.sent} из ${st.last.total}). Нажми «Отправить всем» с тем же текстом, чтобы продолжить.`; }
    }

    async function refreshMe() {
      try { state.me = await api("/api/me"); if (state.view === "profile") renderProfile(); $("balChip").replaceChildren(pix("star", 16), String((state.me.profile && state.me.profile.balance) || 0)); } catch (e) {}
    }

    // ---------- Окна ----------
    let closeSheet = null;
    function openSheet(content) {
      if (closeSheet) closeSheet();
      const overlay = h("div", { class: "overlay", onclick: (e) => { if (e.target === overlay) close(); } }, h("div", { class: "sheet" }, content));
      document.body.append(overlay);
      document.body.style.overflow = "hidden";
      const onBack = () => close();
      function close() {
        overlay.remove();
        document.body.style.overflow = "";
        if (tg && tg.BackButton) { try { tg.BackButton.hide(); tg.BackButton.offClick(onBack); } catch (e) {} }
        closeSheet = null;
      }
      if (tg && tg.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(onBack); } catch (e) {} }
      closeSheet = close;
      return close;
    }

    function openItem(it) {
      const link = safeUrl(it.link);
      let action;
      const bal = (state.me.profile && state.me.profile.balance) || 0;
      let hint = null;
      if (it.price > 0 && !it.owned) {
        action = btn(`Купить за ${it.price} ★`, bal >= it.price ? "" : "alt", () => buy(it), "star");
        hint = h("p", { class: "how", style: "margin:10px 2px 0" }, bal >= it.price
          ? `У тебя ${bal} ★. После покупки останется ${bal - it.price} ★.`
          : `У тебя ${bal} ★, не хватает ${it.price - bal} ★. Приглашай друзей: +${(state.me.profile && state.me.profile.reward) || 2} ★ за каждого.`);
      }
      else if (link) action = btn("Скачать", "", () => download(it, link), "down");
      else action = h("button", { class: "btn slot", disabled: true }, "Ссылка пока не добавлена");

      const admin = state.me.admin
        ? h("div", { class: "three" },
            btn("Изменить", "alt", () => withAdmin(() => openEditor(it))),
            btn(it.hidden ? "Показать" : "Скрыть", "alt", () => withAdmin(() => toggleHidden(it))),
            btn("Удалить", "red", () => withAdmin(() => remove(it))))
        : null;

      openSheet([
        cover(it, true),
        h("div", { class: "body" },
          h("h2", {}, it.title),
          h("div", { class: "chips" },
            h("span", { class: "slot px", style: "font-size:10px;color:" + (it.price > 0 && !it.owned ? "var(--gold)" : "var(--free)") }, it.price > 0 ? it.price + " ★" : "FREE"),
            h("span", { class: "slot" }, pix(catOf(it.category).icon, 16), catOf(it.category).name),
            h("span", { class: "slot" }, pix("down", 14), `${it.downloads || 0}`)
          ),
          it.by_user ? h("p", { class: "how", style: "margin:12px 0 0;color:var(--gold)" }, "Товар от пользователя с подпиской") : null,
          it.description ? h("div", { class: "desc" }, it.description) : null,
          action, hint, admin
        ),
      ]);
    }

    function download(it, link) {
      api(`/api/items/${it.id}/download`, { method: "POST" }).catch(() => {});
      it.downloads = (it.downloads || 0) + 1;
      sortItems(state.items);
      openLink(link);
      renderCatalog();
    }

    async function buy(it) {
      const bal = (state.me.profile && state.me.profile.balance) || 0;
      if (bal < it.price) {
        toast(`Не хватает ${it.price - bal} ★. Приглашай друзей в профиле`);
        closeSheet && closeSheet(); setView("profile");
        return;
      }
      const ok = tg && tg.showConfirm ? await new Promise((res) => tg.showConfirm(`Купить «${it.title}» за ${it.price} ★?`, res)) : confirm(`Купить «${it.title}» за ${it.price} ★?`);
      if (!ok) return;
      try {
        const r = await api(`/api/items/${it.id}/buy`, { method: "POST" });
        it.owned = true; it.link = r.link || it.link;
        state.me.profile.balance = r.balance;
        $("balChip").replaceChildren(pix("star", 16), String(r.balance));
        haptic("success");
        toast(r.already ? "Этот товар уже куплен" : "Куплено! Осталось " + r.balance + " ★");
        renderCatalog();
        openItem(it);
      } catch (e) {
        if (e.code === "not_enough") { state.me.profile.balance = e.balance || 0; toast("Не хватает звёзд"); }
        else toast("Не получилось купить: " + e.message);
      }
    }

    // ---------- Админ-код ----------
    function adminErr(e) {

    // Сжатие картинки: до 900 px, WebP (или JPEG), не больше ~600 000 символов
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 900 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          let type = "image/webp", q = 0.82;
          let data = canvas.toDataURL(type, q);
          if (!data.startsWith("data:image/webp")) { type = "image/jpeg"; data = canvas.toDataURL(type, q); }
          while (data.length > 600000 && q > 0.35) { q -= 0.1; data = canvas.toDataURL(type, q); }
          resolve(data);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad_image")); };
        img.src = url;
      });
    }

          haptic("success"); toast("Создан код " + r.code); closeSheet && closeSheet(); openPromos();
        } catch (e) {
          create.disabled = false;
          err.textContent = ({ exists: "Такой код уже есть", bad_code: "Код: 3–32 символа, латиница, цифры, - и _", bad_value: kind.value === "stars" ? "Звёзды: от 1 до 1000" : "Скидка: от 1 до 99%", bad_max: "Использований: от 1 до 100000" })[e.code] || adminErr(e);
        }
      });
      const rows = d.codes.map((c) => h("div", { class: "friend", style: "align-items:flex-start" },
        h("div", { style: "flex:1;min-width:0" },
          h("div", { style: "word-break:break-all;font-weight:650" }, c.code),
          h("div", { style: "color:var(--hint);font-size:12px" }, (c.kind === "stars" ? `+${c.value} ★` : `скидка ${c.value}%`) + ` · использовано ${c.used} из ${c.max_uses}` + (c.active ? "" : " · выключен"))),
        h("button", { class: "btn slot alt", style: "margin:0;padding:8px 12px;width:auto;font-size:13px", onclick: async () => {
          try { await api(`/api/admin/promo/${encodeURIComponent(c.code)}/${c.active ? "off" : "on"}`, { method: "POST" }); closeSheet && closeSheet(); openPromos(); } catch (e) { toast(adminErr(e)); }
        } }, c.active ? "Выключить" : "Включить")));
      openSheet(h("div", { class: "body" },
        h("h2", {}, "Промо-коды"),
        h("label", {}, "Новый код"), field(code),
        h("label", {}, "Что даёт"), field(kind),
        h("label", {}, "Размер"), field(value),
        h("label", {}, "Сколько раз можно использовать"), field(max),
        err, create,
        h("div", { class: "sec" }, "Все коды"),
        h("div", { class: "friends slot" }, rows.length ? rows : [h("div", { class: "empty", style: "padding:24px" }, "Пока нет ни одного")]),
        btn("Закрыть", "alt", () => closeSheet && closeSheet())
      ));
    }

    // ---------- События ----------
    $("logo").append(pix("cube", 24));
    $("fab").append(pix("plus", 26));
    $("search").addEventListener("input", (e) => { state.q = e.target.value; renderCatalog(); });
    $("fab").addEventListener("click", () => withAdmin(() => openEditor(null)));
    $("hbCatalog").addEventListener("click", () => { if (state.view !== "catalog") setView("catalog"); });
    $("giftBtn").addEventListener("click", openPromo);
    $("hbSub").addEventListener("click", () => { if (state.view !== "sub") setView("sub"); });
    $("hbProfile").addEventListener("click", async () => { if (state.view !== "profile") { setView("profile"); await refreshMe(); } });
    // Вернулся из канала — проверяем подписку сам
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      if (state.view === "msg" && state.me && state.me.auth && !state.me.subscribed) load(true);
      else if (state.view === "profile") refreshMe();
      else if (state.view === "sub") loadSub();
    });

    showMsg("cube", "Загружаю…", "Подожди секунду.");
    load();
  </script>
</body>
</html>
