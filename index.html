<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Каталог</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #7d7d7d);
      --link: var(--tg-theme-link-color, #2481cc);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
      --free: #2ea44f;
      --danger: #e5484d;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
    }
    header { padding: 16px 14px 8px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.3px; }
    .sub { margin: 2px 0 0; color: var(--hint); }

    .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 14px 10px; }
    .tabs { display: flex; gap: 6px; background: var(--card); border-radius: 14px; padding: 4px; }
    .tab {
      flex: 1; border: 0; background: transparent; color: var(--hint);
      padding: 9px 4px; border-radius: 11px; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer;
      transition: background .15s, color .15s;
    }
    .tab.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .search {
      width: 100%; margin-top: 8px; border: 0; outline: 0; border-radius: 12px;
      background: var(--card); color: var(--text); font: inherit; padding: 11px 14px;
    }
    .search::placeholder { color: var(--hint); }

    .banner { margin: 6px 14px; padding: 10px 12px; border-radius: 12px; background: var(--card); color: var(--hint); font-size: 13px; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 4px 14px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .item { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; position: relative; transition: transform .12s; }
    .item:active { transform: scale(.97); }
    .thumb { aspect-ratio: 4 / 3; width: 100%; display: block; object-fit: cover; background: var(--card); }
    .ph { display: flex; align-items: center; justify-content: center; font-size: 38px; }
    .info { padding: 10px 12px 12px; }
    .name { font-weight: 650; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; }
    .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--hint); }
    .price { font-weight: 700; font-size: 13px; padding: 3px 9px; border-radius: 999px; background: rgba(46,164,79,.16); color: var(--free); }
    .price.paid { background: rgba(255,170,0,.18); color: #d98a00; }
    .badge-hidden { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 999px; }
    .empty { text-align: center; color: var(--hint); padding: 50px 20px; grid-column: 1 / -1; }

    .fab {
      position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 8;
      width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-text);
      font-size: 30px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.3); cursor: pointer;
    }

    .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; animation: fade .18s; }
    .sheet {
      width: 100%; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0;
      padding: 0 0 calc(18px + env(safe-area-inset-bottom)); animation: up .22s ease-out;
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .sheet .hero { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: var(--card); }
    .sheet .body { padding: 16px; }
    .sheet h2 { margin: 0 0 6px; font-size: 22px; }
    .sheet .desc { color: var(--text); opacity: .85; white-space: pre-wrap; margin: 10px 0 16px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--hint); font-size: 13px; }
    .btn {
      display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 700;
      background: var(--accent); color: var(--accent-text); cursor: pointer; margin-top: 8px; text-align: center;
    }
    .btn.ghost { background: var(--card); color: var(--text); }
    .btn.danger { background: rgba(229,72,77,.14); color: var(--danger); }
    .btn:disabled { opacity: .5; }
    .admin-row { display: flex; gap: 8px; margin-top: 14px; }
    .admin-row .btn { margin-top: 0; padding: 11px 6px; font-size: 14px; }

    label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 6px; }
    input[type=text], input[type=number], input[type=url], textarea, select {
      width: 100%; border: 0; outline: 0; border-radius: 12px; background: var(--card); color: var(--text); font: inherit; padding: 12px 14px;
    }
    textarea { min-height: 90px; resize: vertical; }
    .imgpick { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; background: var(--card); overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--hint); }
    .imgpick img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .check { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .check input { width: 20px; height: 20px; }
    .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 40; background: rgba(0,0,0,.85); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 85%; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Каталог Minecraft</h1>
    <p class="sub">Ресурс паки, конфиги и шейдеры</p>
  </header>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" type="search" placeholder="Поиск" autocomplete="off">
  </div>

  <div id="banner"></div>
  <main class="grid" id="grid"></main>
  <button class="fab" id="fab" hidden aria-label="Добавить">+</button>

  <script>
    // ====== НАСТРОЙКИ ======
    // Адрес сервера (Cloudflare Worker). Пока пусто — приложение работает в демо-режиме.
    const API_URL = "https://mybot.fleexis123.workers.dev";
    // Username в Telegram для кнопки «Купить» (без @). Пусто — кнопка покажет подсказку.
    const CONTACT = "";
    // Твой Telegram ID: только чтобы показать тебе причину, если админка не открылась.
    const OWNER_ID = 5171403469;
    // =======================

    const CATS = [
      { id: "resourcepacks", name: "Ресурс паки", icon: "🎨" },
      { id: "configs", name: "Конфиги", icon: "⚙️" },
      { id: "shaders", name: "Шейдеры", icon: "✨" },
    ];

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const state = { cat: CATS[0].id, q: "", items: [], admin: false, demo: !API_URL };

    // ---------- Вспомогательные ----------
    function h(tag, props, ...kids) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (k === "class") node.className = v;
        else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else if (v === true) node.setAttribute(k, "");
        else if (v !== false && v != null) node.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid == null || kid === false) continue;
        node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return node;
    }

    function toast(text) {
      const t = h("div", { class: "toast" }, text);
      document.body.append(t);
      setTimeout(() => t.remove(), 2600);
    }

    function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }

    function catOf(id) { return CATS.find((c) => c.id === id) || CATS[0]; }

    function priceLabel(p) { return p > 0 ? `${p} ⭐` : "Бесплатно"; }

    function imgSrc(item) {
      return item.has_image && API_URL ? `${API_URL}/api/img/${item.id}?v=${item.v}` : "";
    }

    function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }

    // ---------- Сервер ----------
    async function api(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (tg && tg.initData) headers.Authorization = "tma " + tg.initData;
      if (opts.body) headers["Content-Type"] = "application/json";
      const res = await fetch(API_URL + path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "http_" + res.status);
      return data;
    }

    const DEMO_ITEMS = [
      { id: 1, category: "resourcepacks", title: "Faithful Pastel 32x", description: "Мягкие пастельные текстуры для спокойной игры.", price: 0, link: "", downloads: 128, hidden: false },
      { id: 2, category: "resourcepacks", title: "PvP Clean 16x", description: "Минимум шума, максимум видимости.", price: 25, link: "", downloads: 64, hidden: false },
      { id: 3, category: "configs", title: "Visual Config Pro", description: "Готовый визуальный конфиг.", price: 0, link: "", downloads: 301, hidden: false },
      { id: 4, category: "shaders", title: "Soft Glow Shader", description: "Мягкий свет и красивая вода.", price: 0, link: "", downloads: 412, hidden: false },
    ];

    async function load() {
      if (state.demo) {
        state.items = DEMO_ITEMS;
        render();
        return;
      }
      try {
        const [items, me] = await Promise.all([api("/api/items"), api("/api/me").catch(() => ({ admin: false }))]);
        state.items = items.items;
        state.admin = !!me.admin;
        document.getElementById("fab").hidden = !state.admin;
        const WHY = {
          no_bot_token: "На сервере не задан BOT_TOKEN. Добавь его в Cloudflare как Secret.",
          bad_signature: "Подпись Telegram не сошлась: в BOT_TOKEN не токен этого бота (или он устарел).",
          no_initdata: "Приложение открыто не из Telegram.",
          not_in_admin_list: "Твоего ID нет в списке админов на сервере.",
        };
        const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
        const notes = [];
        if (me.open) notes.push(h("div", { class: "banner" }, "⚠️ Открытый режим: админом может стать любой. Скоро отключится сам."));
        if (u && u.id === OWNER_ID && me.why && me.why !== "ok") {
          notes.push(h("div", { class: "banner" }, "Диагностика: " + (WHY[me.why] || me.why)));
        }
        document.getElementById("banner").replaceChildren(...notes);
      } catch (e) {
        document.getElementById("banner").replaceChildren(h("div", { class: "banner" }, "Не удалось загрузить каталог. Проверь интернет и попробуй позже."));
      }
      render();
    }

    // ---------- Отрисовка ----------
    function renderTabs() {
      const box = document.getElementById("tabs");
      box.replaceChildren(
        ...CATS.map((c) =>
          h("button", { class: "tab" + (c.id === state.cat ? " active" : ""), onclick: () => { state.cat = c.id; render(); } }, c.name)
        )
      );
    }

    function card(item) {
      const src = imgSrc(item);
      const thumb = src
        ? h("img", { class: "thumb", src, alt: "", loading: "lazy" })
        : h("div", { class: "thumb ph", style: `background: linear-gradient(135deg, hsl(${(item.id * 67) % 360} 55% 45%), hsl(${(item.id * 67 + 50) % 360} 60% 30%))` }, catOf(item.category).icon);
      return h("div", { class: "item", onclick: () => openItem(item) },
        item.hidden ? h("div", { class: "badge-hidden" }, "скрыт") : null,
        thumb,
        h("div", { class: "info" },
          h("div", { class: "name" }, item.title),
          h("div", { class: "meta" },
            h("span", { class: "price" + (item.price > 0 ? " paid" : "") }, priceLabel(item.price)),
            h("span", {}, `↓ ${item.downloads || 0}`)
          )
        )
      );
    }

    function render() {
      renderTabs();
      if (state.demo) {
        document.getElementById("banner").replaceChildren(h("div", { class: "banner" }, "Демо-режим: сервер ещё не подключён, показаны примеры."));
      }
      const q = state.q.trim().toLowerCase();
      const list = state.items.filter((i) => i.category === state.cat && (!q || i.title.toLowerCase().includes(q) || (i.description || "").toLowerCase().includes(q)));
      const grid = document.getElementById("grid");
      grid.replaceChildren(...(list.length ? list.map(card) : [h("div", { class: "empty" }, q ? "Ничего не найдено" : "Пока здесь пусто")]));
    }

    // ---------- Окна ----------
    let closeSheet = null;

    function openSheet(content) {
      if (closeSheet) closeSheet();
      const overlay = h("div", { class: "overlay", onclick: (e) => { if (e.target === overlay) close(); } }, h("div", { class: "sheet" }, content));
      document.body.append(overlay);
      document.body.style.overflow = "hidden";
      const onBack = () => close();
      function close() {
        overlay.remove();
        document.body.style.overflow = "";
        if (tg && tg.BackButton) { tg.BackButton.hide(); tg.BackButton.offClick(onBack); }
        closeSheet = null;
      }
      if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(onBack); }
      closeSheet = close;
      return close;
    }

    function openItem(item) {
      const src = imgSrc(item);
      const hero = src
        ? h("img", { class: "hero", src, alt: "" })
        : h("div", { class: "hero ph", style: `font-size:64px; background: linear-gradient(135deg, hsl(${(item.id * 67) % 360} 55% 45%), hsl(${(item.id * 67 + 50) % 360} 60% 30%))` }, catOf(item.category).icon);

      const link = safeUrl(item.link);
      let action;
      if (item.price > 0) {
        action = h("button", { class: "btn", onclick: () => buy(item) }, `Купить за ${item.price} ⭐`);
      } else if (link) {
        action = h("button", { class: "btn", onclick: () => download(item, link) }, "Скачать");
      } else {
        action = h("button", { class: "btn", disabled: true }, "Ссылка пока не добавлена");
      }

      const adminBox = state.admin && !state.demo
        ? h("div", { class: "admin-row" },
            h("button", { class: "btn ghost", onclick: () => openEditor(item) }, "Изменить"),
            h("button", { class: "btn ghost", onclick: () => toggleHidden(item) }, item.hidden ? "Показать" : "Скрыть"),
            h("button", { class: "btn danger", onclick: () => remove(item) }, "Удалить")
          )
        : null;

      openSheet([
        hero,
        h("div", { class: "body" },
          h("h2", {}, item.title),
          h("div", { class: "row" },
            h("span", { class: "price" + (item.price > 0 ? " paid" : "") }, priceLabel(item.price)),
            h("span", {}, catOf(item.category).name),
            h("span", {}, `↓ ${item.downloads || 0}`)
          ),
          item.description ? h("div", { class: "desc" }, item.description) : h("div", { class: "desc" }),
          action,
          adminBox
        ),
      ]);
    }

    function openLink(url) {
      if (tg && tg.openLink) tg.openLink(url);
      else window.open(url, "_blank");
    }

    function download(item, link) {
      if (!state.demo) api(`/api/items/${item.id}/download`, { method: "POST" }).catch(() => {});
      item.downloads = (item.downloads || 0) + 1;
      openLink(link);
      render();
    }

    function buy(item) {
      if (!CONTACT) { toast("Контакт продавца пока не указан"); return; }
      const url = `https://t.me/${CONTACT}`;
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, "_blank");
    }

    // ---------- Админка ----------
    async function toggleHidden(item) {
      try {
        await api(`/api/admin/items/${item.id}`, { method: "PUT", body: JSON.stringify({ ...item, hidden: !item.hidden }) });
        toast(item.hidden ? "Товар показан" : "Товар скрыт");
        closeSheet && closeSheet();
        await load();
      } catch (e) { toast("Не получилось: " + e.message); }
    }

    async function remove(item) {
      const ok = tg && tg.showConfirm
        ? await new Promise((res) => tg.showConfirm(`Удалить «${item.title}»?`, res))
        : confirm(`Удалить «${item.title}»?`);
      if (!ok) return;
      try {
        await api(`/api/admin/items/${item.id}`, { method: "DELETE" });
        toast("Удалено");
        closeSheet && closeSheet();
        await load();
      } catch (e) { toast("Не получилось: " + e.message); }
    }

    // Сжатие картинки: до 900 px по большей стороне, WebP (или JPEG)
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const max = 900;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          let data = canvas.toDataURL("image/webp", 0.82);
          if (!data.startsWith("data:image/webp")) data = canvas.toDataURL("image/jpeg", 0.82);
          resolve(data);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad_image")); };
        img.src = url;
      });
    }

    function openEditor(item) {
      const isNew = !item;
      const draft = {
        category: item ? item.category : state.cat,
        title: item ? item.title : "",
        description: item ? item.description : "",
        price: item ? item.price : 0,
        link: item ? item.link : "",
        hidden: item ? item.hidden : false,
      };
      let newImage; // undefined — не менять, null — удалить, строка — новая
      const preview = h("div", { class: "imgpick" });
      const fileInput = h("input", { type: "file", accept: "image/*", hidden: true });

      function paintPreview() {
        const src = newImage ? newImage : newImage === null ? "" : item ? imgSrc(item) : "";
        preview.replaceChildren(src ? h("img", { src, alt: "" }) : h("span", {}, "Нажми, чтобы выбрать картинку"));
      }
      paintPreview();
      preview.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async () => {
        const f = fileInput.files && fileInput.files[0];
        if (!f) return;
        try { newImage = await compressImage(f); paintPreview(); }
        catch (e) { toast("Не удалось открыть картинку"); }
      });

      const category = h("select", {}, CATS.map((c) => h("option", { value: c.id, selected: c.id === draft.category }, c.name)));
      const title = h("input", { type: "text", maxlength: "80", value: draft.title, placeholder: "Название" });
      const desc = h("textarea", { maxlength: "600", placeholder: "Описание" });
      desc.value = draft.description;
      const price = h("input", { type: "number", min: "0", step: "1", inputmode: "numeric", value: String(draft.price) });
      const link = h("input", { type: "url", value: draft.link, placeholder: "https://… (Яндекс Диск, Mega, Google Drive)" });
      const hidden = h("input", { type: "checkbox" });
      hidden.checked = draft.hidden;
      const saveBtn = h("button", { class: "btn" }, isNew ? "Добавить" : "Сохранить");

      saveBtn.addEventListener("click", async () => {
        const body = {
          category: category.value,
          title: title.value.trim(),
          description: desc.value.trim(),
          price: Math.max(0, Math.floor(Number(price.value) || 0)),
          link: link.value.trim(),
          hidden: hidden.checked,
        };
        if (!body.title) { toast("Введи название"); return; }
        if (body.link && !safeUrl(body.link)) { toast("Ссылка должна начинаться с https://"); return; }
        if (newImage !== undefined) body.image = newImage;
        saveBtn.disabled = true;
        try {
          if (isNew) await api("/api/admin/items", { method: "POST", body: JSON.stringify(body) });
          else await api(`/api/admin/items/${item.id}`, { method: "PUT", body: JSON.stringify(body) });
          haptic("success");
          toast(isNew ? "Добавлено" : "Сохранено");
          closeSheet && closeSheet();
          state.cat = body.category;
          await load();
        } catch (e) {
          saveBtn.disabled = false;
          toast("Не получилось: " + e.message);
        }
      });

      const removeImg = !isNew && item.has_image
        ? h("button", { class: "btn ghost", onclick: () => { newImage = null; paintPreview(); } }, "Убрать картинку")
        : null;

      openSheet(
        h("div", { class: "body" },
          h("h2", {}, isNew ? "Новый товар" : "Редактирование"),
          h("label", {}, "Картинка"), preview, fileInput, removeImg,
          h("label", {}, "Раздел"), category,
          h("label", {}, "Название"), title,
          h("label", {}, "Описание"), desc,
          h("label", {}, "Цена в звёздах (0 = бесплатно)"), price,
          h("label", {}, "Ссылка на файл"), link,
          h("label", { class: "check" }, hidden, h("span", {}, "Скрыть из каталога")),
          saveBtn
        )
      );
    }

    // ---------- События ----------
    document.getElementById("search").addEventListener("input", (e) => { state.q = e.target.value; render(); });
    document.getElementById("fab").addEventListener("click", () => openEditor(null));

    load();
  </script>
</body>
</html>
