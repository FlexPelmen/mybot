name = "mybot"
main = "worker/worker.js"
compatibility_date = "2026-11-01"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "mybot-catalog"
database_id = "3e961ef6-5418-4029-aafd-e1a5d24c9b4d"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
