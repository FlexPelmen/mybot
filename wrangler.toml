name = "mybot"
main = "worker/worker.js"
compatibility_date = "2026-11-01"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "mybot-catalog"
database_id = "3e961ef6-5418-4029-aafd-e1a5d24c9b4d"

[vars]
ADMIN_IDS = "5171403469"
# Временный открытый режим админки на 2 часа (unix-время): потом выключается сам
OPEN_ADMIN_UNTIL = "1795505838"
# Подписка: ссылка на оплату (DonationAlerts), цена в рублях и срок в днях
DONATION_URL = "https://dalink.to/flexlegend"
SUB_PRICE = "59"
SUB_DAYS = "30"
# Хеш админ-кода (сам код в репозитории не хранится)
ADMIN_CODE_HASH = "3782f9f744b10d51df1a958675b19f226260bbbed83cce1a4a20d15b0e90afe0"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
